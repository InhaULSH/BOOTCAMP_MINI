      automotive:{name:'자동차',index:'KRX 자동차',value:2243.61,change:.82,icon:'car',title:'자동차, 제품의 변화를 읽다.',description:'판매 구성과 해외 생산, 공시에서 사업의 방향을 살펴보세요.',companies:[['hyundai','현대차','HD',244500,.91,17],['kia','기아','KA',112800,1.06,21],['mobis','현대모비스','MB',264000,.55,12]],terms:['하이브리드','판매 믹스','해외 생산','전동화','SUV','설비 투자','부품 공급','수익성','신차','미국 시장','연구개발','수출'],insight:'<strong>하이브리드와 고부가 차종의 판매 비중이 확대</strong>되고 있습니다. 해외 생산시설 투자와 함께 전동화 부품 개발도 이어지고 있어 완성차와 부품 기업의 사업 변화가 연결됩니다.',insight2:'다만 <strong>제품 구성 개선이 이익 증가로 이어지는지</strong>는 판매량과 비용 변화를 함께 확인해야 합니다. 신규 공장의 가동률과 지역별 수요도 중요한 확인 항목입니다.',focus:'고부가 차종 판매 확대와 해외 생산 투자',uncertainty:'지역별 수요와 신규 생산시설 가동률',keyword:'하이브리드',meaning:'엔진과 전기모터를 함께 사용하는 자동차입니다. 주행 상황에 따라 두 동력원을 활용해 연료 사용을 줄이는 방식입니다.'},
      materials:{name:'첨단 소재',index:'산업 대표 주가지수',value:1924.38,change:1.37,icon:'shield',title:'첨단 소재, 수요의 변화를 읽다.',description:'고객 산업의 변화와 신규 소재 투자, 공시에서 함께 읽어보세요.',companies:[['hvm','에이치브이엠','HV',28750,2.14,27],['korea-zinc','고려아연','KZ',712000,.48,12],['iljin','롯데에너지머티리얼즈','LE',36800,1.05,17]],terms:['첨단 금속','항공우주','고객 인증','고순도','생산능력','신규 소재','설비 투자','연구개발','수주','산업용 소재','품질 관리','수출'],insight:'<strong>고순도·첨단 소재 중심으로 고객 산업이 확대</strong>되고 있습니다. 기업들은 생산능력을 늘리고 품질 인증을 확보하면서 항공우주와 첨단 산업 분야의 신규 수요에 대응하고 있습니다.',insight2:'다만 <strong>투자가 매출로 연결되는 시점</strong>은 고객 인증과 수주 일정에 따라 달라집니다. 신규 설비의 가동과 실제 공급 계약의 진행을 함께 확인할 필요가 있습니다.',focus:'첨단 산업 고객 확보와 생산시설 투자 확대',uncertainty:'고객 인증과 실제 수주 전환',keyword:'첨단 금속',meaning:'항공우주와 반도체 등에서 요구하는 강도·내열성·순도 등의 성능을 갖춘 금속 소재입니다. 사용 목적에 맞게 성분과 제조 과정을 정밀하게 관리합니다.'}

    function seriesFor(company,metric){return quarters.map((_,q)=>{const b=company.base,i=company.index;if(state.sector==='finance'&&metric==='capex')return +(.38+Math.sin(q*.6+i)*.12+i*.025).toFixed(2);const wave=Math.sin(q*.68+i*.75)*5;const recovery=q*.95;switch(metric){case'revenue':return +(b*.48-7+recovery+wave).toFixed(1);case'margin':return +(b*.22+1+q*.45+wave*.34-i*.5).toFixed(1);case'cashflow':return +(b*.36-11+q*1.15+wave*1.9-i*1.1).toFixed(1);default:return +(b*.45-8+q*.8+Math.cos(q*.8+i)*8-i).toFixed(1)}})}

    function renderCloud(){const s=sectors[state.sector],stage=document.getElementById('word-cloud');if(!stage)return;const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d'),W=590,H=230;const weights=[1,.62,.76,.51,.66,.43,.48,.33,.34,.27,.26,.23];let placed=[];for(let scale=1;scale>=.3;scale-=.035){placed=[];let failed=false;for(let i=0;i<s.terms.length;i++){const text=s.terms[i],size=62*Math.pow(weights[i],1.12)*scale;ctx.font=`${i<3?680:580} ${size}px Pretendard,Malgun Gothic,sans-serif`;const width=ctx.measureText(text).width+(i===0||i===4||i===7?size*.28:0)+12,height=size*1.05+8;let found=null;for(let t=0;t<2000;t++){const a=t*.23,rad=Math.sqrt(t)*3.7,x=W/2+Math.cos(a)*rad*1.65,y=H/2+Math.sin(a)*rad*.72;const box={x:x-width/2,y:y-height/2,w:width,h:height};if(box.x<5||box.y<5||box.x+width>W-5||box.y+height>H-5)continue;if(placed.some(p=>box.x<p.x+p.w&&box.x+width>p.x&&box.y<p.y+p.h&&box.y+height>p.y))continue;found={...box,size,text,i,cx:x,cy:y};break}if(!found){failed=true;break}placed.push(found)}if(!failed)break}const minX=Math.min(...placed.map(p=>p.x)),maxX=Math.max(...placed.map(p=>p.x+p.w)),minY=Math.min(...placed.map(p=>p.y)),maxY=Math.max(...placed.map(p=>p.y+p.h));const zoom=Math.min((W-20)/(maxX-minX),(H-22)/(maxY-minY));const tx=W/2-(minX+maxX)/2*zoom,ty=H/2-(minY+maxY)/2*zoom;stage.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="공시 키워드, 클릭하여 설명 확인"><g transform="translate(${tx},${ty}) scale(${zoom})">${placed.map(p=>`<g class="cloud-word" tabindex="0" role="button" aria-label="${p.text} 용어 해설" data-term="${p.i}"><text x="${p.cx}" y="${p.cy}" dominant-baseline="central" text-anchor="middle" font-size="${p.size}" font-weight="${p.i<3?680:580}" fill="${['#1d3558','#4c6bb9','#355cde','#617791'][p.i%4]}">${p.text}</text>${[0,4,7].includes(p.i)?`<text x="${p.cx+p.w/2-9}" y="${p.cy-p.size*.32}" text-anchor="middle" font-size="${Math.max(8,p.size*.28)}">🔥</text>`:''}</g>`).join('')}</g></svg>`;stage.querySelectorAll('[dat     function showMetricTip(panel,companyId,q){clearTimeout(tipTimers.get(panel));const c=companiesFor(sectors[state.sector]).find(c=>c.id===companyId),metric=metricList().find(m=>m.id===panel.dataset.metric);panel.querySelectorAll('.chart-series').forEach(g=>{g.style.opacity=g.dataset.company===companyId?'1':'.17';g.querySelector('path').style.strokeWidth=g.dataset.company===companyId?'2.8':'2'});panel.querySelectorAll('[data-legend]').forEach(b=>b.classList.toggle('selected',b.dataset.legend===companyId));let tip=panel.querySelector('.metric-tooltip');if(!tip){tip=document.createElement('div');tip.className='metric-tooltip';tip.addEventListener('mouseenter',()=>clearTimeout(tipTimers.get(panel)));tip.addEventListener('mouseleave',()=>scheduleTipClose(panel));panel.appendChild(tip)}const absolute=i=>`${fmt(financialAmount(c,metric.id,i))}억원`;tip.innerHTML=q===null?`<strong>${c.name} · ${metric.source}</strong>${[0,1,2].map(i=>`<div class="tip-row"><span>${2023+i}년</span><b class="numeric">${absolute(i)}</b><button data-metric-source="${i}">원문</button></div>`).join('')}<div class="tip-context">연간 절대 수치 · 가상 데이터</div>`:`<strong>${c.name} · ${quarters[q]}</strong><div class="tip-row"><span>${metric.title}</span><b class="numeric">${sign(seriesFor(c,metric.id)[q])}</b></div><div class="tip-row"><span>${metric.source}</span><b class="numeric">${fmt(financialAmount(c,metric.id,Math.floor(q/4),q))}억원</b></div><div class="tip-row"><span>참고한 공시</span><button data-metric-source="${Math.floor(q/4)}">원문 표 보기</button></div><div class="tip-context">가상 수치 · ${metric.desc}</div>`;tip.querySelectorAll('[data-metric-source]').forEach(b=>b.addEventListener('click',()=>openMetricSource(c,metric,+b.dataset.metricSource,b,q)))}

    function openTerm(i,trigger){const s=sectors[state.sector],term=s.terms[i];let meaning=i===0?s.meaning:term==='CAPEX'?metrics[3].help:`${term}은 ${s.name} 기업의 사업과 투자 방향을 살펴볼 때 함께 읽는 용어입니다. 관련 제품과 고객 수요, 생산 및 투자 상황을 연결해 이해할 수 있습니다.`;openDrawer('용어 해설 · 공시에서 확인한 내용',`<div class="drawer-kicker">${s.name} 공시 클라우드</div><h3>${term}</h3><div class="drawer-empty-line"></div><div class="drawer-body">${meaning}</div><section class="drawer-section"><h4>공시에서 확인한 내용</h4><p class="drawer-body">${s.name} 기업들은 ${term}과 관련해 ${s.focus} 내용을 설명합니다. 이 변화가 실제 사업 성과로 이어지는지 확인하려면 ${s.uncertainty}를 함께 살펴볼 필요가 있습니다.<button class="citation" data-drawer-source="1" aria-label="용어 설명의 예시 공시 근거">1</button></p></section><div class="mock-notice">${icon('info')}용어 해설과 공시 내용은 화면 구성을 위한 예시입니다.</div>`,trigger)}

    function showToast(text){const t=document.getElementById('toast');clearTimeout(toastTimer);t.textContent=text;t.classList.add('show');toastTimer=setTimeout(()=>t.classList.remove('show'),2400)}
    function route(){if(document.getElementById('drawer').classList.contains('open'))closeDrawer();tipTimers.forEach(clearTimeout);tipTimers.clear();const parts=location.hash.slice(1).split('/'),home=!parts[0]||parts[0]==='home';state.sector=sectors[parts[1]]?parts[1]:'semiconductor';state.company=parts[0]==='company'&&companiesFor(sectors[state.sector]).some(c=>c.id===parts[2])?parts[2]:null;document.getElementById('app').innerHTML=home?renderHome():renderReport();if(!home)bindReport();window.scrollTo({top:0,behavior:'instant'});document.title=home?'DART BIG:IN · 시장 둘러보기 · 견본':`${state.company?companiesFor(sectors[state.sector]).find(c=>c.id===state.company).name:sectors[state.sector].name} 리포트 · DART BIG:IN 견본`}
    document.getElementById('drawer-close').innerHTML=icon('close');document.getElementById('drawer-close').addEventListener('click',closeDrawer);document.getElementById('backdrop').addEventListener('click',closeDrawer);document.addEventListener('keydown',e=>{const drawer=document.getElementById('drawer');if(!drawer.classList.contains('open'))return;if(e.key==='Escape'){closeDrawer();return}if(e.key==='Tab'){const focusable=[...drawer.querySelectorAll('button,a[href],[tabindex="0"]')].filter(el=>el.offsetParent!==null);const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});window.addEventListener('hashchange',route);route();document.fonts.ready.then(()=>renderCloud());
  </script>
</body>
